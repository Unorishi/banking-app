<div class="min-h-screen bg-gray-100">
  <app-navbar></app-navbar>
  
  <div class="max-w-6xl mx-auto py-10 px-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-10 border-b border-gray-300 pb-4">
      <h1 class="text-2xl font-bold text-gray-800">My Accounts</h1>
      <a routerLink="/accounts/create" 
         class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium shadow-sm">
        + Create Account
      </a>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="text-center py-6">
      <div class="text-gray-600 italic">Loading accounts...</div>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="bg-red-50 border border-red-300 rounded-md p-4 mb-8">
      <div class="text-red-700 font-medium">{{ error }}</div>
    </div>

    <!-- Accounts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" *ngIf="!loading">
      <div *ngFor="let account of accounts" 
           class="bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition">
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-gray-800">
              {{ account.type | titlecase }} Account
            </h3>
            <span class="px-2 py-1 rounded-md text-xs font-semibold"
                  [ngClass]="{
                    'bg-green-100 text-green-700': account.status === 'active',
                    'bg-yellow-100 text-yellow-700': account.status === 'frozen',
                    'bg-red-100 text-red-700': account.status === 'suspended'
                  }">
              {{ account.status | titlecase }}
            </span>
          </div>
          
          <div class="space-y-3">
            <div>
              <div class="text-xs text-gray-500 uppercase tracking-wide">Account Number</div>
              <div class="font-mono text-sm text-gray-700">{{ account.accountNumber }}</div>
            </div>
            
            <div>
              <div class="text-xs text-gray-500 uppercase tracking-wide">Current Balance</div>
              <div class="text-xl font-bold text-blue-700">
                ${{ account.balance | number:'1.2-2' }}
              </div>
            </div>
          </div>
          
          <div class="mt-6">
            <a [routerLink]="['/accounts', account._id]" 
               class="block w-full bg-blue-600 hover:bg-blue-700 text-white text-center px-4 py-2 rounded-md text-sm font-medium shadow-sm">
              View Details
            </a>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="accounts.length === 0 && !loading" 
           class="col-span-full text-center py-12">
        <div class="text-gray-600 mb-4">No accounts found</div>
        <a routerLink="/accounts/create" 
           class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium shadow-sm">
          Create Your First Account
        </a>
      </div>
    </div>
  </div>
</div>
