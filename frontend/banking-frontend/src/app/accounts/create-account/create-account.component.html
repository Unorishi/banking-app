<div class="min-h-screen bg-gray-100">
  <app-navbar></app-navbar>
  
  <div class="max-w-md mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-white py-8 px-6 border border-gray-200 shadow-sm rounded-xl sm:px-10">
      <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-gray-800">Create New Account</h2>
        <p class="mt-1 text-sm text-gray-500">Select the account type you want to open</p>
      </div>

      <!-- Success Message -->
      <div *ngIf="success" class="mb-4 bg-green-50 border border-green-200 rounded-md p-4 text-sm">
        <div class="text-green-800 font-medium">{{ success }}</div>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="mb-4 bg-red-50 border border-red-200 rounded-md p-4 text-sm">
        <div class="text-red-700 font-medium">{{ error }}</div>
      </div>

      <form [formGroup]="createAccountForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="type" class="block text-sm font-medium text-gray-700 mb-1">Account Type</label>
          <select id="type" formControlName="type"
                  class="block w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="">-- Select account type --</option>
            <option *ngFor="let type of accountTypes" [value]="type.value">{{ type.label }}</option>
          </select>
          <div *ngIf="type?.invalid && type?.touched" class="mt-1 text-xs text-red-600">
            <div *ngIf="type?.errors?.['required']">Account type is required</div>
          </div>
        </div>

        <div class="flex space-x-4">
          <button type="button" 
                  (click)="router.navigate(['/accounts'])"
                  class="flex-1 py-2 px-4 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-gray-50 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400">
            Cancel
          </button>
          <button type="submit" 
                  [disabled]="loading || !createAccountForm.valid"
                  class="flex-1 py-2 px-4 rounded-md text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 disabled:opacity-50">
            {{ loading ? 'Creating...' : 'Create Account' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
